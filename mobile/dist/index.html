<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Axivon</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #0B0D10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      object-fit: contain;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .text {
      margin-top: 16px;
      font-size: 14px;
      color: #9CA3AF;
      letter-spacing: 0.3px;
      max-width: 320px;
      line-height: 1.5;
    }
    .btn {
      display: none;
      margin-top: 20px;
      padding: 12px 28px;
      background: #10B981;
      color: #04130E;
      font-weight: 600;
      font-size: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:active {
      background: #059669;
    }
  </style>
  <script>
    function openApp() {
      var statusEl = document.getElementById("status-text");
      var spinnerEl = document.getElementById("spinner");
      var retryBtn = document.getElementById("retry-btn");
      if (statusEl) statusEl.innerText = "Connecting to Axivon Secure Portal...";
      if (spinnerEl) spinnerEl.style.display = "block";
      if (retryBtn) retryBtn.style.display = "none";

      window.location.replace("https://axivontech.in/app");
    }

    window.addEventListener("load", function() {
      openApp();

      // If navigation hasn't unloaded page after 10s, show retry UI
      setTimeout(function() {
        var statusEl = document.getElementById("status-text");
        var spinnerEl = document.getElementById("spinner");
        var retryBtn = document.getElementById("retry-btn");
        if (statusEl) statusEl.innerText = "Unable to connect to server. Please check your internet connection and try again.";
        if (spinnerEl) spinnerEl.style.display = "none";
        if (retryBtn) retryBtn.style.display = "inline-block";
      }, 10000);
    });

    window.addEventListener("online", openApp);
  </script>
</head>
<body>
  <img src="assets/logo-icon.png" alt="Axivon" class="logo" />
  <div id="spinner" class="spinner"></div>
  <div id="status-text" class="text">Connecting to Axivon Secure Portal...</div>
  <button id="retry-btn" class="btn" onclick="openApp()">Retry Connection</button>
</body>
</html>
