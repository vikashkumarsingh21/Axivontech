<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Axivon</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0B0D10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .text {
      margin-top: 16px;
      font-size: 14px;
      color: #9CA3AF;
      letter-spacing: 0.5px;
    }
  </style>
  <script>
    window.location.replace("https://axivontech.in/login");
  </script>
</head>
<body>
  <div class="spinner"></div>
  <div class="text">Connecting to Axivon Secure Portal...</div>
</body>
</html>
