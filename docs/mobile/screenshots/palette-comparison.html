<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Axivon Mobile App - 3 Non-Blue Palette Comparison</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
    body {
      background: #0B0D10;
      color: #EDEBE6;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    .header {
      text-align: center;
      max-width: 800px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #EDEBE6;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #B3AFA6;
      line-height: 1.5;
    }
    .comparison-grid {
      display: flex;
      gap: 28px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .phone-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .phone-frame {
      width: 390px;
      height: 844px;
      border: 6px solid #232324;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 20px 48px rgba(0,0,0,0.6);
      position: relative;
    }
    .phone-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .palette-label {
      font-size: 15px;
      font-weight: 600;
      color: #EDEBE6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Axivon Mobile UI Palette Options (App Mode)</h1>
    <p>Dark layered warm-graphite theme (#121212 / #1A1A1B / #232324) with 3 calibrated non-blue accents. All comply with WCAG 2.1 AA text contrast.</p>
  </div>
  <div class="comparison-grid">
    
      <div class="phone-container">
        <div class="palette-label">
          <span class="color-swatch" style="background-color: #4F9D83;"></span>
          Option A: Muted Emerald-Sage (Default)
        </div>
        <div class="phone-frame">
          <iframe src="./palette-option-a-emerald.html"></iframe>
        </div>
      </div>
    
      <div class="phone-container">
        <div class="palette-label">
          <span class="color-swatch" style="background-color: #C87D55;"></span>
          Option B: Warm Terracotta-Clay
        </div>
        <div class="phone-frame">
          <iframe src="./palette-option-b-terracotta.html"></iframe>
        </div>
      </div>
    
      <div class="phone-container">
        <div class="palette-label">
          <span class="color-swatch" style="background-color: #D4A359;"></span>
          Option C: Muted Amber-Ochre
        </div>
        <div class="phone-frame">
          <iframe src="./palette-option-c-amber.html"></iframe>
        </div>
      </div>
    
  </div>
</body>
</html>
